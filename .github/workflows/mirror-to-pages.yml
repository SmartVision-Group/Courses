name: Mirror to public Pages site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Build mirror payload
        run: |
          mkdir -p /tmp/mirror
          # Copy everything except git internals and workflow files —
          # the public mirror only ever needs the published site content.
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/mirror/

      - name: Push mirror to public courses-site repo
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is not set. See README.md for setup."
            exit 1
          fi
          cd /tmp/mirror
          git init -b main
          git config user.name "courses-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Mirror from SmartVision-Group/Courses@${GITHUB_SHA}" --allow-empty
          git push --force "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/SmartVision-Group/courses-site.git" main:main
